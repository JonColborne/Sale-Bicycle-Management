{% extends "base.html" %}
{% block title %}Password Reset{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
<div class="col-md-5">
<div class="card shadow">
<div class="card-header bg-dark text-white"><h5 class="mb-0">Password Reset</h5></div>
<div class="card-body">
{% if form %}
<form method="post">{% csrf_token %}
{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
<button type="submit" class="btn btn-dark">Submit</button>
</form>
{% else %}
<p>Check your email for instructions.</p>
<a href="{% url 'login' %}" class="btn btn-dark">Back to Sign In</a>
{% endif %}
</div>
</div>
</div>
</div>
{% endblock %}
