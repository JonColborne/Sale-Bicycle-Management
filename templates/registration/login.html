{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-bicycle me-2"></i>BSPCMS</h4>
                <small>Bicycle Stock, PDI &amp; Compliance Management</small>
            </div>
            <div class="card-body p-4">
                <h5 class="card-title mb-4">Sign In</h5>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}"
                               name="{{ field.html_name }}"
                               id="{{ field.id_for_label }}"
                               class="form-control {% if field.errors %}is-invalid{% endif %}"
                               {% if field.value %}value="{{ field.value }}"{% endif %}
                               autocomplete="{{ field.html_name }}">
                        {% for error in field.errors %}
                        <div class="invalid-feedback">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark">Sign In</button>
                    </div>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'password_reset' %}" class="text-muted small">Forgot your password?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
