{% extends "base.html" %}
{% block title %}Used Vehicle Assessment{% endblock %}

{% block content %}
<div class="row mb-3">
    <div class="col">
        <h2>Used Vehicle Assessment</h2>
    </div>
</div>
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                {% for field in form %}
                <div class="col-md-6">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-dark">Save</button>
                <a href="{% url 'vehicles:vehicle_detail' object.vehicle.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.querySelectorAll('select').forEach(el => el.classList.add('form-select'));
document.querySelectorAll('input, textarea').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
