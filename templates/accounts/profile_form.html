{% extends "base.html" %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row mb-3">
    <div class="col"><h2>My Profile</h2></div>
</div>
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-dark">Save</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.querySelectorAll('input:not([type="checkbox"])').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
